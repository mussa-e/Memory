<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="public/assets/start-settings/stadia_controller_fav.svg">

    <title>TS-Memory</title>

</head>
<body>
    
    <main>
        <section class="settings-left">
            <header class="title">
                <h1 class="title__h1">Settings</h1>
                <div class="title__devider">
                    <img  src="public/assets/start-settings/devider-long.svg">
                </div>
            </header>
            
            <section class="settings-pick">

                <section class="themes">
                    <header class="themes__title">
                        <img class="themes__img" src="public/assets/start-settings/palette.svg"><p class="themes__p">Game themes</p>
                    </header>

                    <div class="code-vibes">
                        <img src="public/assets/start-settings/circle.svg">
                        <p>Code vibes</p>
                        <img class="line-short" src="public/assets/start-settings/line-short.svg">
                    </div>

                    <div class="gaming-theme">
                        <img src="public/assets/start-settings/circle.svg">
                        <p>Gaming theme</p>
                        <img class="line-short" src="public/assets/start-settings/line-short.svg">
                    </div>
                </section>

                <section class="player">
                    <header class="player__title">
                        <img class="player__img" src="public/assets/start-settings/chess_pawn.svg"><p class="player__p">Choose player</p>
                    </header>

                    <div class="player__blue">
                        <img src="public/assets/start-settings/circle.svg">
                        <p>Blue</p>
                        <img class="line-short" src="public/assets/start-settings/line-short.svg">
                    </div>

                    <div class="player__orange">
                        <img src="public/assets/start-settings/circle.svg">
                        <p>Orange</p>
                        <img class="line-short" src="public/assets/start-settings/line-short.svg">
                    </div>
                    
                </section>

                <section class="board">
                    <header class="board__title">
                        <img class="board__img" src="public/assets/start-settings/board-size.svg"><p class="board__p">Board size</p>
                    </header>

                    <div class="board__16">
                        <img src="public/assets/start-settings/circle.svg">
                        <p>16 cards</p>
                        <img class="line-short" src="public/assets/start-settings/line-short.svg">
                    </div>

                    <div class="board__24">
                        <img src="public/assets/start-settings/circle.svg">
                        <p>24 cards</p>
                        <img class="line-short" src="public/assets/start-settings/line-short.svg">
                    </div>

                    <div class="board__36">
                        <img src="public/assets/start-settings/circle.svg">
                        <p>36 cards</p>
                        <img class="line-short" src="public/assets/start-settings/line-short.svg">
                    </div>
                    
                </section>

            </section>

        </section>

        <aside class="settings-right">
            <div class="theme">
                <img class="theme__img" src="public/assets/start-settings/code-vibes-theme.svg">
            </div>

            <div class="settings-info">
                <p class="settings-info__theme">Theme</p>
                <img class="settings-info__skew" src="public/assets/start-settings/line-skew.svg">
                <p class="settings-info__player">Player</p>
                <img class="settings-info__skew" src="public/assets/start-settings/line-skew.svg">
                <p class="settings-info__board">Board size</p>
                <img class="settings-info__start-btn" src="public/assets/start-settings/start-btn-disabled.svg">
                
            </div>

        </aside>
    </main>




    
    <script defer type="module" src="./src/ts/settings.ts"></script>
    
    
</body>
</html>
