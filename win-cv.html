<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />

    <link rel="icon" type="image/png" href="public/assets/start-settings/stadia_controller_fav.svg">

    <title><TS-Memory>TS-Memory</title>
</head>

<body>
    
    <section id="win-section-cv" class="win-section-cv">

        <header class="header" data-aos="fade-down" data-aos-delay="400">
            <img src="public/assets/win/confetti.svg">
        </header>

        <section class="winner" data-aos="fade-up" data-aos-delay="600">
            The winner is
        </section>

        <section id="player" class="player" data-aos="fade-up" data-aos-delay="800">
            <P id="player-color" class="player__color"></P>
            <p class="player__suffix">Player</p>
        </section>

        <section class="pawn" data-aos="fade-up" data-aos-delay="800">
            <img id="pawn" src="">
        </section>

        <div class="button">
            <a href="settings.html">
                <img src="public/assets/win/back-to-start.svg">
            </a>
        </div>

    </section>




    <section id="draw-section-cv" class="draw-section-cv">

        <p class="itsa" data-aos="fade-down" data-aos-delay="400">
            It’s a
        </p>

        <div class="draw" data-aos="fade-down" data-aos-delay="600">
            <img src="public/assets/win/draw-text.svg">
        </div>

        <div class="draw__scale" data-aos="fade-down" data-aos-delay="800">
            <img src="public/assets/win/draw-cv.svg">
        </div>

        <div class="draw__button" data-aos="fade-up" data-aos-delay="1000">
            <a href="settings.html">
                <img src="public/assets/win/back-to-start.svg">
            </a>
        </div>

    </section>




    
    <script defer type="module" src="./src/ts/win-cv.ts"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
    AOS.init({
        duration: 1000,
        easing: 'ease-out-cubic',
        offset: 100,
        once: true
    });

    window.addEventListener('resize', () => {
        AOS.refresh();
    });
    </script>
</body>

</html>
