<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />

    <link rel="icon" type="image/png" href="public/assets/start-settings/stadia_controller_fav.svg">

    <title><TS-Memory>TS-Memory</title>
</head>

<body>
    
    <div class="game-over" data-aos="fade-down" data-aos-delay="400">
        <img src="public/assets/endscreen-cv/game over.svg">
    </div>

    <p class="final-score" data-aos="fade-up" data-aos-delay="1000">
        Final score
    </p>

    <section class="score" data-aos="fade-up" data-aos-delay="1200">
        <div class="score__blue">
            <img src="public/assets/endscreen-cv/blue-score.svg">
            <p id="blue-score-cv"></p>
        </div>

        <div class="score__orange">
            <img src="public/assets/endscreen-cv/orange-score.svg">
            <p id="orange-score-cv"></p>
        </div>
    </section>







    <script defer type="module" src="./src/ts/endscreen.ts"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
    AOS.init({
        duration: 1000,
        easing: 'ease-out-cubic',
        offset: 100,
        once: true
    });

    window.addEventListener('resize', () => {
        AOS.refresh();
    });
    </script>
</body>

</html>
