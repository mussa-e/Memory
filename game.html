<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="public/assets/stadia_controller_fav.svg">

    <title>TS-Memory</title>
</head>
<body id="game-body">

    <header id="header" class="header">
        <section id="header-left" class="header__left">
            <div class="header__left-blue">
                <img id="player-blue" src="">
                <p id="score-blue">0</p>
            </div>
            <div class="header__left-orange">
                <img id="player-orange" src="">
                <p id="score-orange">0</p>
            </div>
        </section>

        <section class="header__mid">
            <p>Current Player:</p>
            <div id="current-player-wrapper" class="header__mid-current-player">
                <img id="current-player" src="">
            </div>
        </section>

        <section class="header__right">
            <img id="exit-btn" src="">
        </section>
        
    </header>

    <aside class="overlay" id="overlay">
        <div class="popup" id="popup">
            <p>Are you sure you want to quit the game?</p>
            <div class="popup__btns">
                <div id="back-btn" class="popup__back-to-game"></div>
                <div id="exit-popup" class="popup__exit-game"></div>
            </div>
        </div>
    </aside>
    
        

    
    <section class="field" id="field">
        
    </section>

    
    
    <script defer type="module" src="./src/ts/game.ts"></script>
    
</body>
</html>
