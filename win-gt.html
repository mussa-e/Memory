<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />

    <link rel="icon" type="image/png" href="public/assets/start-settings/stadia_controller_fav.svg">

    <title><TS-Memory>TS-Memory</title>
</head>

<body>
    
    
    <section id="win-section-gt" class="win-section">

        <div class="winner" data-aos="fade-down" data-aos-delay="400">
            The winner is
        </div>

        <div id="player-gt" class="player" data-aos="fade-up" data-aos-delay="600">
            <p id="player-color-gt" class="player__color"></p>
            <p class="player__suffix">Player</p>
        </div>

        <div class="cup" data-aos="fade-up" data-aos-delay="800">
            <img src="public/assets/win/cup.svg">
        </div>

        <div class="button" data-aos="fade-up" data-aos-delay="1000">
            <a href="settings.html">
                <img src="public/assets/win/home-gt.svg">
            </a>
        </div>

    </section>


    <section id="draw-section-gt" class="draw-section" data-aos="fade-up" data-aos-delay="400">
        <div class="itsa">
            It’s a
        </div>

        <div class="draw">
            DRAW
        </div>

        <div class="draw__scale">
            <img src="public/assets/win/draw-gt.svg">
        </div>

        <div class="draw__button" data-aos="fade-up" data-aos-delay="1000">
            <a href="settings.html">
                <img src="public/assets/win/home-gt.svg">
            </a>
        </div>
    </section>






    
    <script defer type="module" src="./src/ts/win-gt.ts"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
    AOS.init({
        duration: 1000,
        easing: 'ease-out-cubic',
        offset: 100,
        once: true
    });

    window.addEventListener('resize', () => {
        AOS.refresh();
    });
    </script>
</body>

</html>
